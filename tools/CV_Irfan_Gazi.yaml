# ---------------------------------------------------------------------------
# Source for data/CV_Irfan_Gazi.pdf. Run by hand, like the other tools/ scripts
# — the site never invokes rendercv, and the rendered PDF is committed.
#
#   python3 -m venv .venv
#   .venv/bin/pip install "rendercv[full]" click
#   .venv/bin/rendercv render tools/CV_Irfan_Gazi.yaml
#   cp rendercv_output/Irfan_Gazi_CV.pdf data/CV_Irfan_Gazi.pdf
#
# Long prose uses block scalars (>-) throughout, because plain YAML scalars
# cannot contain ": " and most of these sentences do.
#
# This is a third copy of CV content, after index.html and xr/data/cv.js.
# Nothing keeps the three in sync — update all of them.
# ---------------------------------------------------------------------------
cv:
  name: Irfan Gazi
  location: Lincoln, NE, USA
  email: igazi2@huskers.unl.edu
  website: https://irfan-gazi0.github.io/Portfolio/
  social_networks:
    - network: LinkedIn
      username: irfan-gazi
    - network: GitHub
      username: Irfan-Gazi0
    - network: ORCID
      username: 0009-0004-5817-8845

  sections:
    research_interests:
      - label: Focus
        details: >-
          Generative AI and LLM agents for the physical job site; mixed reality (VR/XR) training
          environments; computer vision; BIM and digital twins; construction safety and risk

    summary:
      - >-
        M.S. student and Graduate Research Assistant at the Durham School of Architectural Engineering
        and Construction, University of Nebraska–Lincoln, advised by Dr. Kyungki Kim. My work sits where
        generative AI meets the physical job site: I build the mixed-reality environments that inspector
        training runs inside, and I work on giving language models real authority over physical systems
        without giving up the determinism safety-critical work depends on — wrapping probabilistic plans
        in structures that can be audited before anything moves. Alongside the inspector-training work I
        build the XR and AI training portal for a Clean Cities Jumpstart project on electric-vehicle
        emergency response. Open to PhD positions and research collaborations from mid-2027.

    "Journal Articles":
      - title: >-
          LLM-Orchestrated Framework for Multifunctional Robotic Health Attendant (RHA) in Healthcare
          Environments
        authors:
          - Kyungki Kim
          - '***Irfan Gazi***'
          - John Windle
          - Christian Haas
          - Melissa Christian
          - Tom Windle
          - Nicholas Armstrong
          - Logan Doorlag
          - Tuankhanh Dao
        journal: Applied Sciences 16(11):5320
        doi: 10.3390/app16115320
        date: 2026-05
      - title: >-
          A hybrid framework for occupational risk prioritization in construction projects using
          Monte Carlo simulation and utility theory
        authors:
          - Md Tanvir Rahman Rifat
          - Shuvo Dip Datta
          - Md. Mehrab Hossain
          - Md Shah Jamal
          - Marcel Maghiar
          - Sani Aliyu
          - '***Irfan Gazi***'
        journal: Scientific Reports
        doi: 10.1038/s41598-026-63788-2
        date: 2026-08

    "In Progress":
      - name: A Systematic Review of Deep Learning-Based Drone Applications in the Construction Industry
        date: In Preparation
        summary: >-
          ***Irfan Gazi*** (first author). A PRISMA-guided review of how deep learning is actually being
          flown on construction sites, tracing where CNN and YOLO-family methods are credibly accurate
          across the phases of a project — and where reported performance thins out.
          Supervisor: Dr. Md. Habibur Rahman Sobuz.
      - name: >-
          Applications of Digital Twin Based on BIM in Construction 4.0: A Systematic Literature Review
        date: Under Review
        summary: >-
          International Journal of Building Pathology and Adaptation. Where BIM-derived digital twins
          have genuinely been deployed under the Construction 4.0 banner, and which of the claimed
          applications are still proposals rather than practice.

    conference_presentations:
      - name: >-
          InspectionGPT: Advancing Inspector Training Workflow in NDOT with an Agentic RAG-MCP Based
          Chatbot
        location: San Antonio, TX
        date: 2026-03
        summary: >-
          Poster. CI & CRC Joint Conference. ***Irfan Gazi***, Kyungki Kim. Supported by the Nebraska
          Department of Transportation.
      - name: >-
          AI and Immersive AR/VR for Sustained Material and Construction Inspection Training and
          Knowledge Retention
        location: Lincoln, NE
        date: 2026-07
        summary: >-
          Talk. Nebraska Department of Transportation & University of Nebraska–Lincoln Research Summit
          2026. Presented the NDOT-funded project on behalf of the team.
          PI: Kyungki Kim; Co-PI: Chun-Hsing (Jun) Ho.

    "Software & Systems":
      - name: '[Safety-Gated LLM Controller for a Hospital Robot](https://github.com/Irfan-Gazi0/robot-multi-agent-pytree)'
        summary: Python, py_trees, LLM orchestration, Docker, pytest
        highlights:
          - >-
            A deterministic six-priority behaviour tree sits between `gpt-4o-mini` and the actuators —
            infrastructure emergency, access control, plan validation, medication safety, ambiguity, then
            execution. The root selector keeps no memory between ticks, so a facility emergency preempts
            an in-flight task on the very next tick.
          - >-
            15 unit tests and 8 deterministic scenarios cover invalid JSON, unknown skills, medication
            overdoses, contradictory orders, and an adversarial prompt injection the tree refuses.
      - name: '[Token-Budget-Aware Retrieval for Medical Literature](https://github.com/Irfan-Gazi0/LitePack-RAG)'
        summary: Python, RAG, Pinecone, OpenAI, FastAPI, React
        highlights:
          - >-
            Given a fixed 1,800-token context budget, the LitePack scorer trades relevance against
            redundancy, keyword coverage and passage length, then packs greedily up to the budget.
          - >-
            Against cosine-similarity ranking and MMR over a Pinecone index of PubMed chunks, across 20
            clinical questions: fewest prompt tokens (1,734) at the highest ROUGE-L (0.476) and keyword
            support (0.93).
      - name: '[Emergency Response Assistant for Electric Vehicles](https://github.com/Irfan-Gazi0/RAG_Responder)'
        summary: LangChain, GPT-4o, Pinecone, Whisper, n8n, three.js
        highlights:
          - >-
            A first-responder portal for EV incidents: a 360° walkthrough of a Ford Mach-E beside a
            chatbot that routes each question to the source that can answer it — the 38-page Emergency
            Response Guide, the rescue sheet, or Whisper-transcribed training narration.
          - >-
            Roughly 578 documents across three Pinecone namespaces, with a routing agent picking between
            them per question.
      - name: '[This CV, Rebuilt as a Walkable Construction Site](https://github.com/Irfan-Gazi0/Portfolio)'
        summary: three.js, WebGL, ES modules, Canvas
        highlights:
          - >-
            Five fenced compounds with notice boards bolted to the hoarding, a third-person camera that
            dodges walls, a travelling shadow frustum, and two times of day standing in for light and
            dark mode. No texture files and no build step.
      - name: '[COVID-19 Misinformation Classifier under Temporal Drift](https://github.com/Irfan-Gazi0/covid19-misinfo-detector-nlp)'
        summary: TensorFlow, Keras, NLP, LSTM
        highlights:
          - >-
            Trained on May articles and tested on July ones, so the distribution genuinely shifts instead
            of being shuffled into a convenient split. Five experiments across LNN, LSTM and MLP heads,
            scored on minority-class recall rather than accuracy.

    "BIM Projects":
      - name: Revit-Based Architectural and Plumbing Coordination
        summary: >-
          Autodesk Revit, AutoCAD. A unified architectural and plumbing model for a commercial building,
          built from parametric components so supply, drainage and fixture connections stay consistent
          when anything moves, with legacy AutoCAD data cross-referenced.
      - name: HVAC System Design and BIM Coordination
        summary: >-
          Autodesk Revit. Supply, return and exhaust ducting modelled alongside chilled-water piping and
          the fan coil unit, sized to hold design flow rates through every branch; drawings carry duct
          dimensions, flow in L/s, and device tags at each diffuser.
      - name: Clash Detection and Model Coordination
        summary: >-
          Autodesk Navisworks, Revit. Federating the architectural, structural and MEP models surfaced
          123 clashes in a single Clash Detective run, each pinned to a level and grid intersection so it
          could be assigned and closed at design stage rather than found as rework.

design:
  theme: classic
  page:
    size: us-letter
    # NOTE: rendercv 2.3 only renders with the default 2cm margins — any other
    # value dies in its Typst template with "cannot multiply dictionary with
    # integer". Leave the four *_margin keys unset until that version is bumped.
    show_page_numbering: true
    show_last_updated_date: true
  colors:
    name: rgb(157, 34, 53)
    connections: rgb(60, 60, 60)
    section_titles: rgb(157, 34, 53)
    links: rgb(20, 84, 122)
  text:
    font_family: Source Sans 3
    font_size: 9.5pt
    leading: 0.58em
    alignment: justified
  header:
    name_font_size: 26pt
  entries:
    date_and_location_width: 4.4cm
    vertical_space_between_entries: 1em
locale:
  language: en
